# SteamProcessIdler configuration manifest
[package]
name = "SteamProcessIdler"
version = "1.3.0"
edition = "2024"

# Dependencies for GUI, system APIs, process manipulation and network
[dependencies]
eframe = { version = "0.31.0", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10.1", features = ["json"] }
winreg = "0.52"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

# Build dependencies for embedding Windows resources
[build-dependencies]
winresource = "0.1"

# Release build optimizations for standalone binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
